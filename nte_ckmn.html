function getCellProbabilities(cellData){const pity=getCurrentPity();const isEnhance=pity>=CONFIG.enhanceStart&&pity<CONFIG.hardPity;const{sIndices,newBraveIndices}=getUpgradeLists(pity);const type=cellData.type;const idx=cellData.index;if(type==='thisS')return{s:100,a:0,b:0,special:'S级角色格（必出S）'};if(type==='thisA')return{s:0,a:100,b:0,special:'A级角色格（必出A）'};if(['chessbox','rosemary','skin_glider','skin_vehicle','skin_character'].includes(type))return{s:0,a:0,b:0,special:'资源格（不产出角色）'};if(type==='again')return{s:0,a:0,b:0,special:'资源格（获得环石）'};if(type==='empty')return{s:0,a:0,b:0,special:'空位'};if(isEnhance&&sIndices.includes(idx))return{s:100,a:0,b:0,special:'变格升级 · 必出S'};let sProb,aProb;if(isEnhance){sProb=19.5;aProb=22.8}else{if(type==='brave'){sProb=3.0;aProb=5.1}else if(type==='apprentice'){sProb=0.2;aProb=5.1}else{sProb=0.6;aProb=5.1}}if(isEnhance&&newBraveIndices.includes(idx)){sProb=3.0;aProb=5.1}const bProb=Math.max(0,100-sProb-aProb);return{s:Math.round(sProb*100)/100,a:Math.round(aProb*100)/100,b:Math.round(bProb*100)/100,special:null}}

function updateBoardVisuals(){const pity=getCurrentPity();const isEnhance=pity>=CONFIG.enhanceStart&&pity<CONFIG.hardPity;document.getElementById('stage1').className=pity<CONFIG.enhanceStart?'on':'off';document.getElementById('stage2').className=isEnhance?'on':'off';document.getElementById('stage3').className=pity>=CONFIG.hardPity?'on':'off';const{sIndices,newBraveIndices}=getUpgradeLists(pity);const currentPos=getCurrentPos();MAP_LIST.forEach(cell=>{const el=cellElements[cell.index];if(!el)return;el.classList.remove('active','active-branch','enhance');const oldBadge=el.querySelector('.s-badge');if(oldBadge)oldBadge.remove();let displayType=cell.type;let extraHtml='';if(isEnhance){if(sIndices.includes(cell.index)){displayType='thisS';extraHtml=`<span class="s-badge"><i class="fas fa-star"></i></span>`}else if(newBraveIndices.includes(cell.index)){displayType='brave'}}const iconClass=ICON_MAP[displayType]||ICON_MAP[cell.type]||'';let html=iconClass?`<i class="fas ${iconClass}"></i>`:'';if(cell.sleep)html+=`<span class="sleep-badge"><i class="fas fa-exclamation"></i></span>`;html+=extraHtml;el.innerHTML=html;el.className='cell '+displayType;if(cell.index===currentPos){el.classList.add(runtimeState.inBranch?'active-branch':'active')}})}

function getNextStepInfo(currentIdx){if(runtimeState.inBranch&&runtimeState.branchQueue.length>0){const next=runtimeState.branchQueue.shift();const branchEnd=runtimeState.branchQueue.length===0;if(branchEnd){runtimeState.inBranch=false;const returnIdx=runtimeState.branchReturnIndex;runtimeState.branchReturnIndex=null;return{nextIdx:next,branchEnd:true,returnIdx:returnIdx}}return{nextIdx:next,branchEnd:false,returnIdx:null}}let next=currentIdx+1;if(next>CONFIG.totalCell)next=1;if(next===55&&!runtimeState.inBranch){next=1}for(const[key,branch]of Object.entries(BRANCH_CONFIG)){if(next===branch.triggerIndex&&Math.random()<branch.probability){runtimeState.inBranch=true;runtimeState.branchQueue=[...branch.branchIndices];runtimeState.branchReturnIndex=branch.returnIndex;const firstBranchIdx=runtimeState.branchQueue.shift();const branchEnd=runtimeState.branchQueue.length===0;if(branchEnd){runtimeState.inBranch=false;runtimeState.branchReturnIndex=null}return{nextIdx:firstBranchIdx,branchStart:true,branchName:branch.name,branchEnd,returnIdx:branch.returnIndex}}}return{nextIdx:next,branchStart:false,branchEnd:false}}

function buildSReward(pool,isHardPity){runtimeState.totalS++;setCurrentPity(0);let rewardName,isUp=false;if(runtimeState.poolType==='standard'){rewardName=pool.sRank[Math.floor(Math.random()*pool.sRank.length)]}else{if(isHardPity){rewardName=pool.upChar;isUp=true}else{if(Math.random()<0.5){rewardName=pool.upChar;isUp=true}else{const other=pool.sRank.filter(c=>c!==pool.upChar);rewardName=other[Math.floor(Math.random()*other.length)]}}}return{rank:'S',name:rewardName,isUp}}

function determineRarity(isHardPity,isEnhance){if(isHardPity)return'S';let sProb,aProb;if(isEnhance){sProb=0.195;aProb=0.228}else{sProb=0.006;aProb=0.051}const rand=Math.random();if(rand<sProb)return'S';if(rand<sProb+aProb)return'A';return'B'}
function calculateReward(cellData,isHardPity,isEnhance){const pool=getNowPool();const type=cellData.type;const idx=cellData.index;const{sIndices}=getUpgradeLists(getCurrentPity());if(type==='thisS')return buildSReward(pool,false);if(type==='thisA')return buildAReward(pool);if(['skin_glider','skin_vehicle','skin_character'].includes(type)){return{rank:'SKIN',name:cellData.name,isUp:false}}if(type==='chessbox'){const count=Math.random()<0.5?4:8;runtimeState.pieces+=count;return{rank:'PIECE',name:`+${count}失维棋子`,isUp:false}}if(type==='rosemary'){runtimeState.pieces+=2;return{rank:'PIECE',name:'+2迷迭棋子',isUp:false}}if(type==='again'){const count=Math.random()<0.5?1:5;runtimeState.gem+=count*180;return{rank:'RESOURCE',name:`+${count*180}环石`,isUp:false}}if(type==='arcana'){const rarity=determineRarity(isHardPity,isEnhance);if(rarity==='S')return buildSReward(pool,false);if(rarity==='A')return buildAReward(pool);return buildBReward(pool)}if(isEnhance&&sIndices.includes(idx)){return buildSReward(pool,false)}const rarity=determineRarity(isHardPity,isEnhance);if(rarity==='S')return buildSReward(pool,false);if(rarity==='A')return buildAReward(pool);return buildBReward(pool)}
async function runSinglePull(){if(runtimeState.gem<180){showModal('环石不足',`需要180环石，当前${runtimeState.gem}`);return null}if(runtimeState.tracking){showModal('追击中','正在追击守护者，请稍后…');return null}runtimeState.gem-=180;runtimeState.totalPull++;runtimeState.pullWave++;setCurrentPity(getCurrentPity()+1);const currentPity=getCurrentPity();const isHardPity=(currentPity>=CONFIG.hardPity);const isEnhance=(currentPity>=CONFIG.enhanceStart&&currentPity<CONFIG.hardPity);const diceEl=document.getElementById('dice-display');diceEl.className='dice-icon dice-rolling';let flashCount=0;const flashInterval=setInterval(()=>{const ri=Math.floor(Math.random()*6)+1;diceEl.innerHTML=`<i class="fas ${DICE_ICONS[ri-1]}"></i>`;flashCount++;if(flashCount>5)clearInterval(flashInterval)},70);await sleepMs(400);clearInterval(flashInterval);if(isHardPity){diceEl.className='dice-icon';const fd=rollRandomDice();diceEl.innerHTML=`<i class="fas ${DICE_ICONS[fd-1]}"></i>`;const reward=buildSReward(getNowPool(),true);runtimeState.recordList.unshift({rank:reward.rank,name:reward.name,upMark:reward.isUp,dicePoint:0,landIndex:getCurrentPos(),cellDesc:'硬保底',pityNow:getCurrentPity(),pool:runtimeState.poolType,time:new Date().toLocaleString(),branch:false});Storage.save();updateAllUI();renderLogList();document.getElementById('roll-tip').innerHTML=`【硬保底】第90抽，必出S！获得 ${reward.name}`;setTimeout(()=>showModal('硬保底触发！',`获得 S级：${reward.name}${reward.isUp?' 【UP限定】':''}`),200);return reward}const finalDot=rollRandomDice();diceEl.className='dice-icon';diceEl.innerHTML=`<i class="fas ${DICE_ICONS[finalDot-1]}"></i>`;let stepsLeft=finalDot;let branchTriggeredName=null;let branchEnded=false;let returnIdx=null;let currentPos=getCurrentPos();while(stepsLeft>0){const stepInfo=getNextStepInfo(currentPos);currentPos=stepInfo.nextIdx;setCurrentPos(currentPos);updateBoardVisuals();await sleepMs(120);if(stepInfo.branchStart)branchTriggeredName=stepInfo.branchName;if(stepInfo.branchEnd){branchEnded=true;returnIdx=stepInfo.returnIdx}stepsLeft--;if(branchEnded&&stepsLeft>0){currentPos=returnIdx;setCurrentPos(currentPos);updateBoardVisuals();await sleepMs(120);branchEnded=false;returnIdx=null}}if(branchEnded&&returnIdx){await sleepMs(150);setCurrentPos(returnIdx);updateBoardVisuals()}const targetCell=IndexMap[getCurrentPos()];if(!targetCell){const reward=buildBReward(getNowPool());runtimeState.recordList.unshift({rank:reward.rank,name:reward.name,upMark:false,dicePoint:finalDot,landIndex:getCurrentPos(),cellDesc:'未知',pityNow:getCurrentPity(),pool:runtimeState.poolType,time:new Date().toLocaleString(),branch:false});Storage.save();updateAllUI();renderLogList();return reward}if(targetCell.sleep){document.getElementById('roll-tip').innerHTML=`投掷点数：${finalDot} 点 → 落位沉眠地！触发追击！`;await sleepMs(300);const result=await runGuardianChase();if(result.success){document.getElementById('roll-tip').innerHTML='<i class="fas fa-trophy"></i> 追上守护者！获得30失维棋子！';showModal('追击成功！','<i class="fas fa-trophy"></i> 成功追上守护者，获得30失维棋子！')}else{document.getElementById('roll-tip').innerHTML='<i class="fas fa-heart-broken"></i> 未能追上守护者…'}runtimeState.recordList.unshift({rank:'EVENT',name:result.success?'追击成功+30棋子':'追击失败',upMark:false,dicePoint:finalDot,landIndex:getCurrentPos(),cellDesc:'沉眠地',pityNow:getCurrentPity(),pool:runtimeState.poolType,time:new Date().toLocaleString(),branch:!!branchTriggeredName});updateAllUI();renderLogList();Storage.save();return null}const reward=calculateReward(targetCell,isHardPity,isEnhance);runtimeState.recordList.unshift({rank:reward.rank,name:reward.name,upMark:reward.isUp||false,dicePoint:finalDot,landIndex:getCurrentPos(),cellDesc:targetCell.name,pityNow:getCurrentPity(),pool:runtimeState.poolType,time:new Date().toLocaleString(),branch:!!branchTriggeredName});Storage.save();updateBoardVisuals();updateAllUI();renderLogList();let tip=`投掷点数：<b style="color:#e8c84a">${finalDot}</b> 点 → 第${getCurrentPos()}格 ${targetCell.name}`;if(reward.rank==='S')tip+=' <i class="fas fa-star" style="color:#ffcc44;"></i> 出S！';document.getElementById('roll-tip').innerHTML=tip;if(reward.rank==='S'){setTimeout(()=>showModal('S级奖励！',`获得 S级：${reward.name}${reward.isUp?' 【UP限定】':''}`),200)}return reward}
async function singlePull(){if(runtimeState.busyPull)return;if(runtimeState.gem<180){showModal('环石不足',`需要180环石，当前${runtimeState.gem}`);return}runtimeState.busyPull=true;document.getElementById('btn-one').disabled=true;document.getElementById('btn-ten').disabled=true;await runSinglePull();runtimeState.busyPull=false;document.getElementById('btn-one').disabled=false;document.getElementById('btn-ten').disabled=false}
async function tenPull(){if(runtimeState.busyPull)return;if(runtimeState.gem<1800){showModal('环石不足',`需要1800环石，当前${runtimeState.gem}`);return}runtimeState.busyPull=true;document.getElementById('btn-one').disabled=true;document.getElementById('btn-ten').disabled=true;for(let i=0;i<10;i++){if(runtimeState.gem<180)break;await runSinglePull();if(i!==9)await sleepMs(CONFIG.tenDelay)}runtimeState.busyPull=false;document.getElementById('btn-one').disabled=false;document.getElementById('btn-ten').disabled=false}
function exchangePieces(){if(runtimeState.pieces<24){showModal('棋子不足',`需要24失维棋子，当前${runtimeState.pieces}`);return}runtimeState.pieces-=24;runtimeState.gem+=180;updateAllUI();Storage.save();showModal('兑换成功','消耗24失维棋子，获得180环石')}
function switchPool(type){if(type===runtimeState.poolType)return;runtimeState.pityMap[runtimeState.poolType]=getCurrentPity();runtimeState.poolType=type;runtimeState.inBranch=false;runtimeState.branchQueue=[];runtimeState.branchReturnIndex=null;document.querySelectorAll('.top-bar button[data-pool]').forEach(b=>{b.classList.toggle('active',b.dataset.pool===type)});updateBoardVisuals();updateAllUI();Storage.save()}
function resetAll(){if(!confirm('确定重置所有数据吗？'))return;runtimeState={gem:14400,pieces:0,poolType:runtimeState.poolType,busyPull:false,pityMap:{limited:0,standard:0},position:{limited:CONFIG.startIndex,standard:CONFIG.startIndex},inBranch:false,branchQueue:[],branchReturnIndex:null,tracking:false,guardianPos:0,playerPos:0,trackAttempts:0,totalPull:0,totalS:0,pullWave:0,recordList:[]};Storage.clear();hidePlayerAvatar();hideGuardianAvatar();hideTrackHUD();updateBoardVisuals();updateAllUI();renderLogList();document.getElementById('dice-display').className='dice-icon';document.getElementById('dice-display').innerHTML='<i class="fas fa-dice"></i>';document.getElementById('roll-tip').innerText='点击单抽开始'}
function updateAllUI(){document.getElementById('gem-count').textContent=runtimeState.gem;document.getElementById('pity-count').textContent=getCurrentPity();document.getElementById('s-total').textContent=runtimeState.totalS;document.getElementById('pull-wave').textContent=runtimeState.pullWave;document.getElementById('piece-count').textContent=runtimeState.pieces}
function renderLogList(){const wrap=document.getElementById('log-container');if(runtimeState.recordList.length===0){wrap.innerHTML='<div style="color:#444;text-align:center;padding:4px;font-size:11px;">记录</div>';return}let html='';runtimeState.recordList.slice(0,CONFIG.logMaxShow).forEach(item=>{const up=item.upMark?'<span style="color:#e8c84a"> [UP]</span>':'';const rc=item.rank==='EVENT'?'tag-EVENT':item.rank==='PIECE'?'tag-PIECE':item.rank==='RESOURCE'?'tag-RESOURCE':item.rank==='SKIN'?'tag-SKIN':`tag-${item.rank}`;const nc=item.rank==='S'?'name-S':'';html+=`<div class="log-item"><span class="rank-tag ${rc}">${item.rank}</span><span class="${nc}">${item.name}${up}</span><span class="detail-text">${item.cellDesc}</span></div>`});wrap.innerHTML=html}
function showStats(){const records=runtimeState.recordList;if(records.length===0){showModal('统计','暂无抽卡数据，先去抽几发吧！');return}const categories={'S':0,'A':0,'B':0,'EVENT':0,'PIECE':0,'RESOURCE':0,'SKIN':0};records.forEach(r=>{if(categories.hasOwnProperty(r.rank))categories[r.rank]++;else if(r.rank==='S')categories.S++});const labels=['S','A','B','事件','棋子','资源','皮肤'];const keys=['S','A','B','EVENT','PIECE','RESOURCE','SKIN'];const data=keys.map(k=>categories[k]||0);const total=data.reduce((a,b)=>a+b,0);const summaryDiv=document.getElementById('stats-summary');summaryDiv.innerHTML=`<div class="stat-item s-color"><div class="num">${categories.S}</div><div class="label">S级</div></div><div class="stat-item a-color"><div class="num">${categories.A}</div><div class="label">A级</div></div><div class="stat-item b-color"><div class="num">${categories.B}</div><div class="label">B级</div></div><div class="stat-item other-color"><div class="num">${categories.EVENT+categories.PIECE+categories.RESOURCE+categories.SKIN}</div><div class="label">其他</div></div><div class="stat-item" style="color:#aaa;"><div class="num">${total}</div><div class="label">总抽数</div></div>`;const canvas=document.getElementById('statsChart');const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);const colors=['#ff6666','#cc88ff','#66aadd','#ffaa66','#66ddbb','#ddcc66','#88ddff'];const maxVal=Math.max(...data,1);const pad={top:20,bottom:30,left:30,right:20};const chartW=W-pad.left-pad.right;const chartH=H-pad.top-pad.bottom;const barW=Math.min(chartW/data.length*0.6,30);const gap=(chartW-barW*data.length)/(data.length+1);ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;for(let i=0;i<=4;i++){const y=pad.top+chartH-(i/4)*chartH;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();ctx.fillStyle='#666';ctx.font='9px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round((i/4)*maxVal),pad.left-4,y+3)}data.forEach((val,i)=>{const x=pad.left+gap+i*(barW+gap);const h=(val/maxVal)*chartH;const y=pad.top+chartH-h;ctx.fillStyle=colors[i%colors.length];ctx.shadowColor='rgba(255,255,255,0.1)';ctx.shadowBlur=8;ctx.fillRect(x,y,barW,h);ctx.shadowBlur=0;ctx.fillStyle='#ddd';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(val,x+barW/2,y-4);ctx.fillStyle='#888';ctx.font='9px sans-serif';ctx.fillText(labels[i],x+barW/2,pad.top+chartH+16)});document.getElementById('stats-modal').classList.add('show')}
function closeStats(){document.getElementById('stats-modal').classList.remove('show')}
function showModal(title,content){document.getElementById('modal-title').textContent=title;document.getElementById('modal-content').innerHTML=content;document.getElementById('modal-overlay').classList.add('show')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show')}
window.onload=function(){const loaded=Storage.load();initBoard();updateAllUI();renderLogList();document.querySelectorAll('.top-bar button[data-pool]').forEach(b=>{b.classList.toggle('active',b.dataset.pool===runtimeState.poolType)});if(loaded)document.getElementById('roll-tip').innerText='已恢复进度';hidePlayerAvatar();hideGuardianAvatar();hideTrackHUD()};
window.singlePull=singlePull;window.tenPull=tenPull;window.resetAll=resetAll;window.switchPool=switchPool;window.exchangePieces=exchangePieces;window.closeModal=closeModal;window.showStats=showStats;window.closeStats=closeStats;
</script>
